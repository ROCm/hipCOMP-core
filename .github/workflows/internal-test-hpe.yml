#
# `/test` and `/test hpe` on a pull request or an issue: parse the command,
# work out what commit it means, and hand the rest to the shared run and report
# workflows.
#
# This file is the trigger and nothing else. The build lives in
# internal-test-hpe-run.yml, which internal-test-hpe-manual.yml also calls, and
# the reporting in internal-test-report.yml, which alola calls too.
#
# An issue_comment event runs the copy of this file on the default branch, not
# the one in the pull request, so a change to the grammar takes effect when it
# merges and a pull request cannot alter how its own command is read. The
# commit that gets tested is resolved through the API and passed on as forty
# characters -- see the resolve step.

name: test (hpe)

on:
  issue_comment:
    types: [created]

# No concurrency group. The single GPU machine already serializes the runs --
# a second one waits for a free runner rather than running beside the first --
# so all a group would add is cancellation, and with several configurations to
# get through, one command killing the run before it is the wrong trade.
# `cancel-in-progress: false` would not do either: a group holds one pending
# slot, so a third command would still cancel the second. Nothing is cancelled
# now except by hand from the Actions tab, and the cost is that a run made
# pointless by a later push stays queued until someone does that.

# Nothing by default. Each job asks for what it needs, and the job that
# executes pull-request code asks only to read it.
permissions: {}

jobs:
  dispatch:
    name: dispatch
    # Authorization comes from the event payload, so an unauthorized comment
    # never reaches a runner. `MEMBER` is any AMD-AIOSS member; narrow this to
    # an explicit list of logins if that is ever too broad.
    #
    # Every comment in the repository starts a run of this workflow, and all but
    # these end here, having allocated nothing.
    #
    # `/test alola` is the other site's command and its own workflow, so it is
    # excluded here rather than parsed and rejected: both files match on a
    # prefix, and only the more specific one may claim that body.
    #
    # A comment on a plain issue counts too, which is what lets a release task
    # carry its own table: `ref=` says what to test, and the rows collect under
    # the issue rather than under any pull request.
    if: >-
      github.repository_owner == 'AMD-AIOSS'
      && startsWith(github.event.comment.body, '/test')
      && !startsWith(github.event.comment.body, '/test alola')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.comment.author_association)
    # Self-hosted and unlabelled: this job only talks to the API.
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    permissions:
      contents: read # expand a short sha
      # The eyes reaction goes on a comment that belongs to a pull request, and
      # GitHub resolves the issues endpoints against the resource's own kind: a
      # token with issues=write but pull-requests=read gets a 403 there. Write
      # here also covers reading the head sha.
      pull-requests: write # react to the triggering comment, resolve the head sha
      issues: write # the same reaction, on a comment to a plain issue
      statuses: write # report "pending" on the commit
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      # What was asked for, which the sha above is the resolution of. Empty on
      # a pull request, where the head is what a run means.
      ref: ${{ steps.parse.outputs.ref }}
      rocm: ${{ steps.parse.outputs.rocm }}
      flags: ${{ steps.parse.outputs.flags }}
      # The commit status context, which describes the configuration, so this
      # run's check does not overwrite another configuration's.
      status: ${{ steps.parse.outputs.status }}
      # The table's shape, decided here because it depends on what the command
      # was run from: a pull request tests one branch, so naming it in every
      # row would be a column of one repeated value, while an issue is where
      # `amd-integration` and a release branch are compared side by side.
      columns: ${{ steps.parse.outputs.columns }}
      key: ${{ steps.parse.outputs.key }}
      note: ${{ steps.parse.outputs.note }}

    steps:
      # /test [hpe] [ref=<branch|tag>] [sha=<7-40 hex>] [rocm=<specifier>]
      #             [-- <cmake flags>]
      - name: Parse the command
        id: parse
        env:
          # Through the environment, never interpolated into the script body: a
          # comment is untrusted text and ${{ }} inside `run` is an injection.
          BODY: ${{ github.event.comment.body }}
          # Whether the comment is on a pull request. Decides what a command
          # with no `ref=` means, and what shape the table takes.
          IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          # -f because the loops below split the comment into words, and a body
          # containing `*` would otherwise be expanded against the filesystem.
          set -euf

          # First line only, so a reply that quotes someone else's command
          # cannot smuggle options past the allowlist below.
          line=${BODY%%$'\n'*}
          line=${line%$'\r'}

          rocm=therock:7.14.0
          sha=
          # What to test, when the comment is not on a pull request whose head
          # answers that. A branch or a tag; `sha=` is how to pin a commit.
          ref=

          # Everything after the first ` -- ` is handed to cmake as it stands.
          # A sentinel rather than a `flags=` option because the options are
          # whitespace-separated words and a flag set is several of them: there
          # is no quoting a comment could carry that would survive the split
          # below, and asking for one would be asking for a shell that is not
          # there. Taken before the prefix is stripped, so the options and the
          # flags are parsed from their own halves of the line.
          flags=
          case "${line}" in
            *" -- "*)
              flags=${line#* -- }
              line=${line%% -- *} ;;
          esac

          # Normalised through the same word splitting build.sh will do, so
          # that two spellings of one flag set are one configuration with one
          # check and one row rather than two. Positional parameters are used
          # again below, so this has to come first.
          set -- ${flags}
          flags="$*"

          # An allowlist, because this is the one part of the command that is
          # not matched against a pattern of its own. `;` stays in: it is
          # cmake's list separator, and `-D GPU_TARGETS=gfx90a;gfx942` is a
          # flag somebody will want. What is kept out is everything a shell
          # would find interesting, so that a flag string cannot become one --
          # the value travels to the build as an environment variable rather
          # than through a shell, and this is the belt to that's braces.
          case "${flags}" in
            *[!-A-Za-z0-9_=+.,:\;/\ ]*)
              echo "::error::the flags after '--' carry a character outside -A-Za-z0-9_=+.,:;/ and space; a cmake list value is semicolon separated and needs no quoting"
              exit 1 ;;
          esac

          # `/test` is a short prefix, and the `if:` above matches it as one, so
          # `/testing something` arrives here. Saying what the command is beats
          # reporting its first word as an unknown option.
          rest=${line#*/test}
          case "${rest}" in
            ''|[[:space:]]*) ;;
            *)
              echo "::error::'${line}' is not the /test command; write '/test' or '/test hpe'"
              exit 1 ;;
          esac

          # The site, optional and consumed before the options: this file is
          # hpe, and a bare `/test` still means it. Written as positional
          # parameters so the token can be shifted off the front.
          set -- ${rest}
          case "${1:-}" in
            hpe) shift ;;
            # `/test  alola`, with two spaces, does not match the prefix the
            # alola workflow triggers on and so arrives here instead, where
            # "unknown option 'alola'" would be a puzzle worth avoiding.
            alola)
              echo "::error::write '/test alola' with a single space"
              exit 1 ;;
          esac

          for tok in "$@"; do
            # Anchored regexes rather than case globs: two of these end up in a
            # git ref and one drives an install.
            #
            # The rocm pattern is the ROCM_SPECIFIER grammar of
            # ci/internal/librocm.sh, minus the two forms that need the Jenkins
            # nodes. Repeated here because this job has no checkout to source
            # the library from.
            # The `?` spellings of the three wildcards are here because a
            # comment is rendered markdown: `*a*` is emphasis, so the text a
            # reader sees is not the specifier that ran. They are passed on as
            # typed; librocm.sh rewrites them to the `*` forms.
            if [[ ${tok} =~ ^rocm=(preinstalled|[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?|therock:(\*|\*(a|rc)\*|\?|\?(a|rc)\?|[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}((a|rc)[0-9]{1,8})?))$ ]]; then
              rocm=${tok#rocm=}
            elif [[ ${tok} =~ ^sha=[0-9a-fA-F]{7,40}$ ]]; then
              sha=${tok#sha=}
            # A git ref, and the API is asked to resolve it rather than a shell
            # being asked to interpolate it.
            elif [[ ${tok} =~ ^ref=[A-Za-z0-9._/-]{1,100}$ ]]; then
              ref=${tok#ref=}
            else
              # Failing beats silently running the default configuration,
              # which is what a typo would otherwise do.
              echo "::error::unknown /test option '${tok}'; the options are ref=, sha= and rocm=, and extra cmake flags go after ' -- '"
              exit 1
            fi
          done

          # Both name what to test, and the answers can differ. Rather than
          # pick one, say so: `ref=` follows a branch, `sha=` pins a commit.
          if [[ -n ${ref} && -n ${sha} ]]; then
            echo "::error::ref=${ref} and sha=${sha} both say what to test; keep the one you meant -- ref= follows a branch, sha= pins a commit"
            exit 1
          fi

          # On a pull request, no ref means the head. On an issue there is no
          # head to mean, and the command has to be told.
          if [[ ${IS_PR} != true && -z ${ref} && -z ${sha} ]]; then
            echo "::error::this comment is on an issue, not a pull request, so there is no head to test; name what to test with ref=<branch> (or sha=<commit>)"
            exit 1
          fi

          # One check per configuration. The statuses API keys a status by
          # commit and context, so a context shared by every run would have each
          # run overwrite the one before it and the checks list would show a
          # single line no matter how many configurations were tried. Built
          # here, once, and reused by the report job: a context that differed
          # between the pending status and the final one would leave two lines
          # instead of updating one.
          #
          # The specifier rather than the version that ends up installed --
          # nothing is installed yet at this point.
          #
          # The site is in the context because the alola workflow tests the same
          # configurations on other cards, and a shared context would have one
          # site's run overwrite the other's check. `mi210` names the card in
          # the status; the runner label is gfx90a.
          status="test hpe (${rocm}, mi210"
          # An if rather than `[[ ... ]] &&`, which under `set -e` would exit
          # the step the moment the condition did not hold.
          #
          # Part of the configuration because a build configured differently is
          # a different build, and the two should not share a check.
          if [[ -n ${flags} ]]; then
            status="${status}, flags ${flags}"
          fi
          status="${status})"

          # What the table looks like, which depends on what the command was
          # run from. A pull request tests its own head and nothing else, so a
          # ref column would repeat one value down every row. An issue is the
          # other case -- a release task spawns runs against amd-integration
          # and against the release branch -- so the ref becomes a column, and
          # the first field of what makes two runs the same configuration.
          #
          # `arch` is in the key but not the columns: this site compiles for
          # one architecture, so a column would repeat it, while leaving it out
          # of the key would have a gfx90a row and a future gfx942 one collide.
          #
          # Emitted from here rather than written into the report call, because
          # only this step knows which event it is.
          if [[ ${IS_PR} == true ]]; then
            columns='["result", "sha", "rocm", "installed", "flags", "run", "at"]'
            key='["rocm", "arch", "flags"]'
            note='One row per configuration, carrying its latest run. A commit that is not the head is a configuration this pull request has not been through since.'
          else
            columns='["result", "ref", "sha", "rocm", "installed", "flags", "run", "at"]'
            key='["ref", "rocm", "arch", "flags"]'
            note='One row per ref and configuration, carrying its latest run. A commit that is not the tip of its ref is a configuration that branch has not been through since.'
          fi

          # What was named, which is what the row is filed under. A pinned
          # commit stands in for a ref it was not given: two runs against two
          # commits of the same branch are two answers about that release task,
          # and a shared empty ref would file them as one.
          named=${ref:-${sha}}

          # The allowlist above is also what keeps a crafted comment from
          # injecting extra keys here: none of these can contain a newline.
          {
            echo "rocm=${rocm}"
            echo "flags=${flags}"
            echo "ref=${named}"
            echo "status=${status}"
            echo "columns=${columns}"
            echo "key=${key}"
            echo "note=${note}"
          } >>"${GITHUB_OUTPUT}"

      - name: Resolve the commit and acknowledge the command
        id: resolve
        uses: actions/github-script@v9
        env:
          # Whichever of `sha=` and `ref=` was given, already refused as a
          # pair by the parse step: one string for one lookup.
          REQUESTED: ${{ steps.parse.outputs.ref }}
          STATUS: ${{ steps.parse.outputs.status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const requested = process.env.REQUESTED;
            let sha;
            if (requested) {
              // One call for both spellings: getCommit resolves a branch, a
              // tag or a short sha, and answers with the full forty characters
              // a commit status has to name. Any commit in the repository is
              // accepted, so a sha that belongs to no pull request will report
              // where nobody looks. Resolved now, so a push between the comment
              // and the build does not change what was tested; `sha=` is how to
              // pin it against the branch moving under a queue.
              sha = (await github.rest.repos.getCommit(
                { owner, repo, ref: requested })).data.sha;
            } else {
              // No ref, so the pull request's head is what was meant. The
              // parse step has already refused this on an issue, where
              // context.issue.number is not a pull request to read.
              sha = (await github.rest.pulls.get(
                { owner, repo, pull_number: context.issue.number })).data.head.sha;
            }
            core.setOutput('sha', sha);

            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: context.payload.comment.id, content: 'eyes',
            });

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              context: process.env.STATUS,
              description: 'queued',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

      # A parameterized run is not reproducible from the comment thread unless
      # the parameters are written down somewhere.
      - name: Record the resolved parameters
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          REF: ${{ steps.parse.outputs.ref }}
          ROCM: ${{ steps.parse.outputs.rocm }}
          FLAGS: ${{ steps.parse.outputs.flags }}
        run: |
          {
            echo "### test (hpe)"
            echo
            if [ -n "${REF}" ]; then
              echo "- ref: \`${REF}\`"
            fi
            echo "- commit: \`${SHA}\`"
            echo "- gpu: mi210 (gfx90a)"
            echo "- rocm: \`${ROCM}\`"
            echo "- cmake flags: ${FLAGS:+\`${FLAGS}\`}${FLAGS:-none}"
          } >>"${GITHUB_STEP_SUMMARY}"

  # The parsed comment, handed to the shared run. `sha` rather than the pull
  # request's branch, so a push between the comment and the build cannot change
  # what is tested, and no secrets are passed: the job that compiles this code
  # gets the read-only token below and nothing else.
  build-and-test:
    needs: dispatch
    permissions:
      contents: read
    uses: ./.github/workflows/internal-test-hpe-run.yml
    with:
      ref: ${{ needs.dispatch.outputs.sha }}
      rocm: ${{ needs.dispatch.outputs.rocm }}
      flags: ${{ needs.dispatch.outputs.flags }}

  # The check on the commit and this site's table, written by the workflow both
  # sites share. What is site-specific is which comment it writes into and what
  # a configuration is here.
  report:
    name: report
    # Runs whatever the build did, but not when the command itself was rejected:
    # a parse error has no commit to report against.
    if: always() && needs.dispatch.result == 'success'
    needs: [dispatch, build-and-test]
    permissions:
      statuses: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/internal-test-report.yml
    with:
      marker: <!-- test-hpe-overview -->
      heading: test (hpe, mi210)
      # The shape the dispatch job worked out from the event: a pull request
      # gets one schema, an issue gets a ref column as well.
      columns: ${{ needs.dispatch.outputs.columns }}
      key: ${{ needs.dispatch.outputs.key }}
      note: ${{ needs.dispatch.outputs.note }}
      result: ${{ needs.build-and-test.result }}
      sha: ${{ needs.dispatch.outputs.sha }}
      ref: ${{ needs.dispatch.outputs.ref }}
      status: ${{ needs.dispatch.outputs.status }}
      rocm: ${{ needs.dispatch.outputs.rocm }}
      # What the installation reported, as against the specifier that asked for
      # it. Empty when the run failed before installing anything.
      installed: ${{ needs.build-and-test.outputs.rocm_version }}
      # Constant at this site, but read back from the run so that the
      # architecture is written down in one place. Falls back to the literal
      # when the run never started, because the report still has a row to file.
      arch: ${{ needs.build-and-test.outputs.arch || 'gfx90a' }}
      flags: ${{ needs.dispatch.outputs.flags }}
